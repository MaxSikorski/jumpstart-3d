<script>
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d'),wrap=$('#wrap');
let X=g,W=0,H=0,dpr=1,mode='tut',tool='rect',V={x:80,y:60,z:26},rooms=[],items=[],sel=null,selI=null,path=null,drag=null,m={x:0,y:0},mw={x:0,y:0},armI=null,armF=null,cat='Kitchen',mat='Wood',rid=1,step=0;
let ARCH_HIDE=false;const S={snap:1,plot:false,pw:60,pd:40,lim:false,sq:2000};
let fmt=f=>{let t=Math.round(f*12),a=Math.floor(t/12),b=t%12;return b?`${a}' ${b}"`:`${a}'`};
const sn=v=>Math.round(v/S.snap)*S.snap,sn5=v=>Math.round(v*2)/2;

const sc=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
function sp(e){const[x,y]=sc(e),w=s2w(x,y);let p={x:sn(w.x),y:sn(w.y)};if(S.plot&&mode==='sketch'){p.x=Math.min(Math.max(p.x,0),S.pw);p.y=Math.min(Math.max(p.y,0),S.pd)}return p}
/* geometry */
function arcInfo(A,M,B){const d=2*(A.x*(M.y-B.y)+M.x*(B.y-A.y)+B.x*(A.y-M.y));if(Math.abs(d)<1e-6)return null;const a=A.x*A.x+A.y*A.y,mm=M.x*M.x+M.y*M.y,b=B.x*B.x+B.y*B.y;
const o={x:(a*(M.y-B.y)+mm*(B.y-A.y)+b*(A.y-M.y))/d,y:(a*(B.x-M.x)+mm*(A.x-B.x)+b*(M.x-A.x))/d},T=2*Math.PI,n=x=>((x%T)+T)%T,
a0=Math.atan2(A.y-o.y,A.x-o.x),a1=Math.atan2(B.y-o.y,B.x-o.x),am=Math.atan2(M.y-o.y,M.x-o.x),d1=n(am-a0),d2=n(a1-a0),ccw=d1>=d2;
return{o,r:Math.hypot(A.x-o.x,A.y-o.y),a0,a1,ccw,th:ccw?T-d2:d2}}
const E=r=>r.v.map((a,i)=>[a,r.v[(i+1)%r.v.length],r.c[i]]);
const len=(A,B,c)=>{const i=c&&arcInfo(A,c,B);return i?i.r*i.th:Math.hypot(B.x-A.x,B.y-A.y)};
function seg(A,B,c){const i=c&&arcInfo(A,c,B);if(i){const o=w2s(i.o);g.arc(o.x,o.y,i.r*V.z,i.a0,i.a1,i.ccw)}else{const b=w2s(B);g.lineTo(b.x,b.y)}}
function trace(r){g.beginPath();const p=w2s(r.v[0]);g.moveTo(p.x,p.y);for(const[A,B,c]of E(r))seg(A,B,c);g.closePath()}
function area(r){let s=0;const e=E(r);for(const[A,B]of e)s+=A.x*B.y-B.x*A.y;const or=s>=0?1:-1;let t=Math.abs(s)/2;
for(const[A,B,c]of e){const i=c&&arcInfo(A,c,B);if(i){const cr=(B.x-A.x)*(c.y-A.y)-(B.y-A.y)*(c.x-A.x);t+=or*(cr>0?-1:1)*i.r*i.r/2*(i.th-Math.sin(i.th))}}return t}
const dims=r=>{const e=E(r),v=r.v;if(v.length==4&&e.every(q=>!q[2])&&v[0].y===v[1].y&&v[1].x===v[2].x&&v[2].y===v[3].y)return fmt(Math.abs(v[1].x-v[0].x))+' × '+fmt(Math.abs(v[2].y-v[1].y));return e.map(q=>(q[2]?'⌒':'')+fmt(len(...q))).join(' · ')};
const cen=r=>({x:r.v.reduce((a,p)=>a+p.x,0)/r.v.length,y:r.v.reduce((a,p)=>a+p.y,0)/r.v.length});
function hitR(sx,sy){for(let i=rooms.length-1;i>=0;i--){trace(rooms[i]);if(g.isPointInPath(sx*dpr,sy*dpr))return rooms[i]}return null}
function hitI(w){for(let i=items.length-1;i>=0;i--){const t=items[i],a=-(t.r||0)*Math.PI/180,dx=w.x-t.x,dy=w.y-t.y,lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);if(Math.abs(lx)<=t.w/2&&Math.abs(ly)<=t.h/2)return t}return null}
/* drawing path tools */
function click(p){if(!path){path={v:[p],c:[],pend:null};return}const P=path,last=P.v[P.v.length-1],same=(a,b)=>a.x===b.x&&a.y===b.y;
if(tool==='arc'){if(!P.pend){if(!same(p,last))P.pend=p;return}const B=P.pend;P.pend=null;add(B,p)}else{if(same(p,last))return;add(p,null)}}
function add(B,c){const P=path;P.c.push(c);if(B.x===P.v[0].x&&B.y===P.v[0].y&&P.v.length>=2){finish();return}P.v.push(B)}
function finish(){const P=path;path=null;const r={id:rid,name:'Room '+rid,v:P.v,c:P.c,floor:null};if(r.c.length!==r.v.length||area(r)<.5)return;rid++;rooms.push(r);sel=r;list()}
/* catalog */

const CAT={Kitchen:[I('cab','Base Cabinet 24"',24,24),I('cab','Base Cabinet 36"',36,24),I('cab','Base Cabinet 48"',48,24),I('cab','Corner Cabinet 36"',36,36),I('cab','Island 72×36',72,36,{isl:1}),I('cab','Island 96×40',96,40,{isl:1}),I('sink','Single Sink 33"',33,22),I('sink','Double Sink 36"',36,22,{dbl:1}),I('stove','Range 30"',30,26),I('fridge','Fridge 36"',36,30),I('fridge','Fridge 30"',30,30),I('dw','Dishwasher 24"',24,24)],
Bedroom:[I('bed','Twin Bed',39,75,{p:1}),I('bed','Full Bed',54,75),I('bed','Queen Bed',60,80),I('bed','King Bed',76,80),I('bed','Cal King Bed',72,84),I('dr','Nightstand',20,16,{dn:1}),I('dr','Dresser 60"',60,18,{dn:3}),I('dr','Dresser 36"',36,18,{dn:2}),I('dr','Wardrobe 48"',48,24,{dn:2}),I('dr','Bench 48"',48,16,{dn:1})],
Bathroom:[I('toilet','Toilet',20,28),I('vanity','Vanity 30"',30,21),I('vanity','Double Vanity 60"',60,22,{dbl:1}),I('ped','Pedestal Sink',20,18),I('tub','Tub 60"',60,30),I('tub','Tub 72"',72,36),I('shower','Shower 36×36',36,36),I('shower','Shower 48×36',48,36),I('cab','Linen Cabinet',24,18)],
'Living Room':[I('sofa','Sofa 84"',84,36),I('sofa','Loveseat 60"',60,36),I('sofa','Armchair',34,34),I('sofa','Recliner',36,38),I('tbl','Coffee Table',48,24),I('rnd','Round Coffee Table',30,30),I('tbl','Side Table',20,20),I('tv','TV Stand 60"',60,18),I('shelf','Bookshelf 36"',36,12)],
'Dining Room':[I('tbl','Table 4 Seats',48,65,{ch:4}),I('tbl','Table 6 Seats',72,65,{ch:6}),I('tbl','Table 8 Seats',96,69,{ch:8}),I('rnd','Round Table 4',68,68,{ch:4}),I('rnd','Round Table 6',78,78,{ch:6}),I('sofa','Chair',18,18),I('dr','Buffet 60"',60,18,{dn:3})],
Closet:[I('clo','Hanging Rod 48"',48,24),I('clo','Hanging Rod 72"',72,24),I('clo','Double Rod 96"',96,24),I('shelf','Shelving 36"',36,14),I('shelf','Shoe Rack 30"',30,12),I('dr','Built-in Dresser',48,24,{dn:3}),I('rnd','Hamper',18,18)],
'Bonus Space':[I('arc','Arcade Machine',26,30),I('pool','Pool Table',100,56),I('ping','Table Tennis',108,60),I('foos','Foosball',56,30),I('desk','Desk 60"',60,30),I('desk','Gaming Desk 72"',72,30),I('shelf','Bookcase 36"',36,12),I('shelf','Bookcase 72"',72,12),I('piano','Upright Piano',58,24),I('tread','Treadmill',30,72),I('bench','Workbench 72"',72,30)],
Rugs:[I('rug','Rug 5×8',60,96,{c:'#9c4a4a'}),I('rug','Rug 8×10',96,120,{c:'#3f6fa8'}),I('rug','Rug 9×12',108,144,{c:'#c9b48a'}),I('rug','Runner 2.5×8',30,96,{c:'#2f7a80'}),I('rrug','Round 6\'',72,72,{c:'#7d8085'}),I('rrug','Round 8\'',96,96,{c:'#c8a040'}),I('rrug','Oval 5×8',60,96,{c:'#7a5a8a'})]};

const rr=(x,y,w,h,f)=>{X.beginPath();X.rect(x,y,w,h);if(f){X.fillStyle=f;X.fill()}X.stroke()},ci=(x,y,r,f)=>{X.beginPath();X.arc(x,y,r,0,7);if(f){X.fillStyle=f;X.fill()}X.stroke()},ln=(a,b,c,d)=>{X.beginPath();X.moveTo(a,b);X.lineTo(c,d);X.stroke()},ov=(x,y,a,b,f)=>{X.beginPath();X.ellipse(x,y,a,b,0,0,7);if(f){X.fillStyle=f;X.fill()}X.stroke()};
const D={bed:(w,h,o)=>{const x=-w/2,y=-h/2,n=o.p||2;rr(x,y,w,h,'#f1f4f8');rr(x,y+h*.28,w,h*.72,'#6f9bd1');for(let i=0;i<n;i++)rr(x+w*(i+.1)/n,y+.2,w*.8/n,Math.min(1.2,h*.17),'#fff');rr(x,y,w,.18,'#7a5230')},
cab:(w,h,o)=>{const x=-w/2,y=-h/2,n=Math.max(1,Math.round(w/1.5));rr(x,y,w,h,o.isl?'#d9c3a0':'#c8a878');for(let i=1;i<n;i++)ln(x+w*i/n,y,x+w*i/n,y+h);rr(x+.08,y+.08,w-.16,h-.16)},
sink:(w,h,o)=>{const n=o.dbl?2:1;rr(-w/2,-h/2,w,h,'#d9d4c9');for(let i=0;i<n;i++)rr(-w/2+w*(i+.12)/n,-h/2+h*.2,w*.76/n,h*.6,'#bcd6e8');ci(0,-h/2+h*.1,h*.07,'#888')},
stove:(w,h)=>{rr(-w/2,-h/2,w,h,'#bfc4ca');[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>ci(a*w*.22,b*h*.2,Math.min(w,h)*.14,'#333'))},
fridge:(w,h)=>{rr(-w/2,-h/2,w,h,'#e3e8ec');ln(-w/2,-h*.1,w/2,-h*.1);rr(-w*.35,-h*.4,.1,h*.25,'#888');rr(-w*.35,h*.05,.1,h*.25,'#888')},

sofa:(w,h)=>{const x=-w/2,y=-h/2,n=Math.max(1,Math.round((w-.9)/2.1));rr(x,y,w,h,'#7d86a6');rr(x+.35,y+h*.3,w-.7,h*.7-.05,'#97a1c4');for(let i=1;i<n;i++)ln(x+.35+(w-.7)*i/n,y+h*.3,x+.35+(w-.7)*i/n,y+h)},
