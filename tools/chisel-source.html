<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Chisel Sculpt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#131518; --view-a:#30353c; --view-b:#15171a;
  --panel:#1a1d21; --panel-2:#21252b; --line:#2d3239; --line-2:#3a4048;
  --text:#e2e5e8; --muted:#8e969f; --faint:#5f666e;
  --accent:#d6a44e; --accent-ink:#1b1407; --accent-soft:rgba(214,164,78,.14);
  --cut:#e3664f; --cut-soft:rgba(227,102,79,.14); --ok:#79bb92;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 var(--sans);overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-columns:58px minmax(0,1fr) 300px;grid-template-rows:46px minmax(0,1fr) 28px;grid-template-areas:"top top top" "tools view panel" "status status status"}
/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:10px;white-space:nowrap}
.brand b{font:600 17px/1 var(--cond);letter-spacing:.02em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font:500 10px/1 var(--mono);color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.tb{display:flex;align-items:center;gap:2px;padding:0 6px;border-left:1px solid var(--line);min-width:0}
.tb:first-of-type{border-left:0}
.btn{appearance:none;border:1px solid transparent;background:transparent;border-radius:6px;height:30px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:var(--line)}
.btn:focus-visible,.tool:focus-visible,.seg button:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(214,164,78,.45);color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default;background:transparent;border-color:transparent}
.btn svg{width:16px;height:16px;flex:none}
.btn .k{font:500 10px var(--mono);color:var(--faint)}
.spacer{flex:1}
#panelToggle{display:none}
/* tool rail */
#tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;overflow-y:auto}
.rail-label{font:600 9px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:6px 0 3px}
.rail-sep{width:28px;height:1px;background:var(--line);margin:5px 0}
.tool{appearance:none;width:42px;height:40px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative;flex:none}
.tool svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{color:var(--text);background:var(--panel-2)}
.tool[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent)}
.tool.cut[aria-pressed="true"]{background:var(--cut);color:#1c0b07}
.tool .kk{position:absolute;right:3px;bottom:2px;font:500 8px/1 var(--mono);opacity:.65}
/* viewport */
#view{grid-area:view;position:relative;background:radial-gradient(120% 90% at 50% 38%,var(--view-a),var(--view-b));overflow:hidden;min-width:0}
#gl,#overlay{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none;cursor:crosshair}
#overlay{pointer-events:none}
#hud{position:absolute;left:12px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.pill{font:500 11px/1 var(--mono);padding:5px 8px;border-radius:99px;background:rgba(15,17,20,.62);border:1px solid var(--line);color:var(--muted);backdrop-filter:blur(6px)}
.pill b{color:var(--text);font-weight:500}
.pill.on b{color:var(--accent)}
.pill.cutp b{color:var(--cut)}
#busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,11,13,.35);z-index:5}
#busy div{font:500 12px var(--mono);padding:10px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
#busy div::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(90%,520px);font-size:12.5px;padding:8px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line-2);box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:6}
#toast.err{border-color:var(--cut);color:#ffd6cd}
/* side panel */
#panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
.sec{padding:12px 14px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.sec h2{margin:0;font:600 11px/1 var(--cond);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h2 em{font:500 10.5px var(--mono);font-style:normal;letter-spacing:0;text-transform:none;color:var(--faint);margin-left:auto}
.sec h2 .dot{width:7px;height:7px;border-radius:2px;background:var(--accent)}
.sec h2 .dot.cut{background:var(--cut)}
.hint{margin:0;color:var(--muted);font-size:12px;line-height:1.45;text-wrap:pretty}
.hint kbd,.kbd{font:500 10.5px var(--mono);padding:1px 4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;color:var(--text)}
.row{display:grid;grid-template-columns:74px minmax(0,1fr) 44px;align-items:center;gap:8px}
.row>span{color:var(--muted);font-size:12px}
.row output{font:500 11px var(--mono);text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:18px;margin:0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:5px;padding:5px 4px;color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg.cutseg button[aria-pressed="true"]{color:var(--cut)}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;color:var(--text)}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.action{appearance:none;border:1px solid var(--line-2);background:var(--panel-2);border-radius:7px;padding:7px 10px;cursor:pointer;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.action:hover{border-color:var(--muted)}
.action.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.action.primary:hover{filter:brightness(1.08)}
.action.danger{background:var(--cut);color:#1c0b07;border-color:var(--cut)}
.action:disabled{opacity:.4;cursor:default;filter:none}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.shapes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11.5px}
.chip svg{width:22px;height:22px;fill:none;stroke:var(--text);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.chip:hover{border-color:var(--accent);color:var(--text)}
.objs{display:flex;flex-direction:column;gap:3px;max-height:190px;overflow-y:auto}
.obj{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;align-items:center;gap:6px;border:1px solid transparent;border-radius:7px;padding:3px 3px 3px 9px;cursor:pointer}
.obj:hover{background:var(--panel-2)}
.obj.sel{background:var(--accent-soft);border-color:rgba(214,164,78,.4)}
.obj .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj .tc{font:400 10.5px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.obj .eye{appearance:none;border:0;background:transparent;width:26px;height:24px;border-radius:5px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.obj .eye:hover{background:var(--line)}
.obj .eye svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5}
.obj.hid .nm{color:var(--faint);text-decoration:line-through}
.xyz{display:grid;grid-template-columns:74px repeat(3,minmax(0,1fr));gap:5px;align-items:center}
.xyz>span{color:var(--muted);font-size:12px}
.xyz input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 5px;font:400 11.5px var(--mono);font-variant-numeric:tabular-nums}
.xyz input:focus{border-color:var(--accent);outline:none}
.axl{display:grid;grid-template-columns:74px repeat(3,minmax(0,1fr));gap:5px;font:500 9.5px var(--mono);color:var(--faint);text-align:center}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{appearance:none;width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;background-size:cover}
.sw[aria-pressed="true"]{border-color:var(--accent)}
select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.empty{color:var(--faint);font-size:12px}

/* brush library */
.lib{display:flex;flex-direction:column;gap:8px}
.lib-cat{font:600 9.5px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.lib-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.bru{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;line-height:1.1;text-align:center;min-height:52px}
.bru svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.bru:hover{border-color:var(--line-2);color:var(--text)}
.bru[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.bru[aria-pressed="true"] svg{stroke:var(--accent);opacity:1}
.bru.mk svg{stroke:#9bb4d6}
#libSearch{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px}
#libSearch:focus{border-color:var(--accent);outline:none}
.sub{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.sub-h{font:600 10px/1 var(--cond);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px}
.sub-h::after{content:"";flex:1;height:1px;background:var(--line)}
.fall{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:8px;align-items:center}
.fall canvas{width:64px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.toggles{display:flex;gap:4px}
.toggles button{flex:1;appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 0;color:var(--muted);cursor:pointer;font:500 12px var(--mono)}
.toggles button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.colorrow{display:grid;grid-template-columns:74px 40px minmax(0,1fr);gap:8px;align-items:center}
.colorrow>span{color:var(--muted);font-size:12px}
.colorrow input[type=color]{width:40px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px}
.acts.four{grid-template-columns:repeat(3,minmax(0,1fr))}
.action.sm{padding:6px 4px;font-size:12px}
.tool.more{color:var(--faint)}
.tool.cur::after{content:"";position:absolute;left:-7px;top:12px;width:3px;height:16px;border-radius:2px;background:var(--accent)}
/* status */
#status{grid-area:status;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font:400 11.5px var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden}
#status .st-tool{color:var(--text);font-weight:500}
#status .st-hint{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
#status .st-count{font:400 11px var(--mono);font-variant-numeric:tabular-nums}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:46px minmax(0,1fr) 54px 26px;grid-template-areas:"top" "view" "tools" "status"}
  #tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);padding:0 8px;justify-content:flex-start}
  .rail-label{display:none}.rail-sep{width:1px;height:26px;margin:0 4px}
  #panel{position:fixed;right:0;top:calc(46px + env(safe-area-inset-top,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:min(320px,88vw);z-index:20;transform:translateX(102%);transition:transform .2s ease;box-shadow:-12px 0 32px rgba(0,0,0,.4);border-radius:10px 0 0 10px}
  #panel.open{transform:none}
  #panelToggle{display:inline-flex}
  .hide-sm{display:none!important}
  .brand span{display:none}
  .st-hint{display:none}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}#busy div::before{animation-duration:2s}}
</style>

<div id="app">
  <header id="top">
    <div class="brand"><b>Chisel<i>.</i></b><span>sculpt + cut</span></div>
    <div class="tb">
      <label class="btn" title="Import an STL or OBJ file" for="importFile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M5 7l3 3 3-3M3 13h10"/></svg><span class="hide-sm">Import</span></label>
      <input id="importFile" type="file" accept=".stl,.obj" hidden>
      <button class="btn" id="exportBtn" title="Export visible objects as STL + OBJ (zip)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 11V3M5 6l3-3 3 3M3 13h10"/></svg><span class="hide-sm">Export</span></button>
    </div>
    <div class="tb">
      <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4L3 7l3 3M3 7h6.5a3.5 3.5 0 0 1 0 7H7"/></svg></button>
      <button class="btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4l3 3-3 3M13 7H6.5a3.5 3.5 0 0 0 0 7H9"/></svg></button>
    </div>
    <div class="tb">
      <button class="btn" id="symBtn" aria-pressed="true" title="Mirror strokes across X (X)">Sym&nbsp;X</button>
      <button class="btn hide-sm" id="wireBtn" aria-pressed="false" title="Wireframe overlay (W)">Wire</button>
      <button class="btn hide-sm" id="flatBtn" aria-pressed="false" title="Flat shading">Flat</button>
      <button class="btn hide-sm" id="gridBtn" aria-pressed="true" title="Floor grid">Grid</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="frameBtn" title="Frame objects (F)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3"/><circle cx="8" cy="8" r="2"/></svg><span class="hide-sm">Frame</span></button>
    <button class="btn" id="panelToggle" aria-pressed="false" title="Show panel">Panel</button>
  </header>

  <nav id="tools" aria-label="Tools"></nav>

  <main id="view">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <div id="hud"></div>
    <div id="busy" hidden><div id="busyText">Working</div></div>
    <div id="toast" hidden></div>
  </main>

  <aside id="panel">
    <section class="sec" id="toolSec"></section>
    <section class="sec" id="brushSec"></section>
    <section class="sec">
      <h2><span class="dot"></span>Add shape<em id="detailNote"></em></h2>
      <div class="seg" id="detailSeg"><button data-v="0">Low</button><button data-v="1">Medium</button><button data-v="2">High</button></div>
      <div class="shapes" id="shapes"></div>
    </section>
    <section class="sec">
      <h2>Objects<em id="objCount"></em></h2>
      <div class="objs" id="objList"></div>
      <div class="acts two"><button class="action" id="dupBtn">Duplicate</button><button class="action" id="delBtn">Delete</button></div>
    </section>
    <section class="sec" id="objSec"></section>
    <section class="sec" id="boolSec"></section>
  </aside>

  <footer id="status"><span class="st-tool" id="stTool"></span><span class="st-hint" id="stHint"></span><span class="st-count" id="stCount"></span></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Chisel geometry core: welding, subdivision, exact CSG (local splitting + ray-parity), voxel remesh (surface nets). No dependencies. */
(function (root) {
  'use strict';

  function bboxOf(T) {
    let a = Infinity, b = Infinity, c = Infinity, d = -Infinity, e = -Infinity, f = -Infinity;
    for (let i = 0; i < T.length; i += 3) {
      const x = T[i], y = T[i + 1], z = T[i + 2];
      if (x < a) a = x; if (y < b) b = y; if (z < c) c = z;
      if (x > d) d = x; if (y > e) e = y; if (z > f) f = z;
    }
    return [a, b, c, d, e, f];
  }

  function weldTris(T, tol) {
    tol = tol || 1e-5;
    const inv = 1 / tol, map = new Map(), pos = [], idx = [];
    const n = T.length / 3, vi = new Int32Array(n);
    for (let i = 0; i < n; i++) {
      const x = T[i * 3], y = T[i * 3 + 1], z = T[i * 3 + 2];
      const key = Math.round(x * inv) + ',' + Math.round(y * inv) + ',' + Math.round(z * inv);
      let id = map.get(key);
      if (id === undefined) { id = pos.length / 3; map.set(key, id); pos.push(x, y, z); }
      vi[i] = id;
    }
    for (let t = 0; t < n; t += 3) {
      const a = vi[t], b = vi[t + 1], c = vi[t + 2];
      if (a !== b && b !== c && a !== c) idx.push(a, b, c);
    }
    return { pos: new Float32Array(pos), idx: new Uint32Array(idx) };
  }

  function toTris(pos, idx, m) {
    const T = new Float32Array(idx.length * 3);
    for (let i = 0; i < idx.length; i++) {
      const v = idx[i] * 3; let x = pos[v], y = pos[v + 1], z = pos[v + 2];
      if (m) {
        const nx = m[0] * x + m[4] * y + m[8] * z + m[12];
        const ny = m[1] * x + m[5] * y + m[9] * z + m[13];
        const nz = m[2] * x + m[6] * y + m[10] * z + m[14];
        x = nx; y = ny; z = nz;
      }
      T[i * 3] = x; T[i * 3 + 1] = y; T[i * 3 + 2] = z;
    }
    return T;
  }

  function transformTris(T, m) {
    const o = new Float32Array(T.length);
    for (let i = 0; i < T.length; i += 3) {
      const x = T[i], y = T[i + 1], z = T[i + 2];
      o[i] = m[0] * x + m[4] * y + m[8] * z + m[12];
      o[i + 1] = m[1] * x + m[5] * y + m[9] * z + m[13];
      o[i + 2] = m[2] * x + m[6] * y + m[10] * z + m[14];
    }
    return o;
  }

  function signedVolume(T) {
    let v = 0;
    for (let i = 0; i < T.length; i += 9) {
      const ax = T[i], ay = T[i + 1], az = T[i + 2], bx = T[i + 3], by = T[i + 4], bz = T[i + 5], cx = T[i + 6], cy = T[i + 7], cz = T[i + 8];
      v += ax * (by * cz - bz * cy) - ay * (bx * cz - bz * cx) + az * (bx * cy - by * cx);
    }
    return v / 6;
  }

  function flipTris(T) {
    for (let i = 0; i < T.length; i += 9) {
      for (let k = 0; k < 3; k++) { const t = T[i + 3 + k]; T[i + 3 + k] = T[i + 6 + k]; T[i + 6 + k] = t; }
    }
    return T;

$('#objList').addEventListener('click', e => {

  if (eye) { const o = objects.find(x => x.id === +eye.dataset.eye); pushUndo(); o.visible = !o.visible; o.mesh.visible = o.visible; refreshAll(); req(); return; }

function renderObjSec() {

function refreshObjPanelValues() {

function renderHud() {

function deleteSel() { if (!sel) return; pushUndo(); const n = sel.name; removeObj(sel); refreshAll(); toast(n + ' deleted'); }

  const n = createObj(uniqueName(o.name.replace(/ \d+$/, '')), o.pos.slice(), o.idx, o.matcap, undefined, o.mask.slice(), o.paint.slice());
  n.mesh.position.copy(o.mesh.position).add(new V3().setFromMatrixColumn(camera.matrixWorld, 0).multiplyScalar(0.4)); n.mesh.rotation.copy(o.mesh.rotation); n.mesh.scale.copy(o.mesh.scale);

/* ================= import / export ================= */
function parseSTL(buf) {
  const dv = new DataView(buf);
  if (buf.byteLength >= 84) {
    const n = dv.getUint32(80, true);
    if (84 + n * 50 === buf.byteLength) {
      const T = new Float32Array(n * 9);
      for (let i = 0; i < n; i++) for (let k = 0; k < 9; k++) T[i * 9 + k] = dv.getFloat32(84 + i * 50 + 12 + k * 4, true);
      return T;
    }
  }
  const txt = new TextDecoder().decode(buf), T = [], re = /vertex\s+([-+\d.eE]+)\s+([-+\d.eE]+)\s+([-+\d.eE]+)/g; let m;
  while ((m = re.exec(txt))) T.push(+m[1], +m[2], +m[3]);
  return new Float32Array(T.slice(0, T.length - T.length % 9));
}
function parseOBJ(txt) {
  const V = [], T = [];
  for (const line of txt.split(/\r?\n/)) {
    const p = line.trim().split(/\s+/);
    if (p[0] === 'v') V.push([+p[1], +p[2], +p[3]]);
    else if (p[0] === 'f') {
      const ids = p.slice(1).map(s => { const i = parseInt(s, 10); return i < 0 ? V.length + i : i - 1; });
      for (let k = 1; k < ids.length - 1; k++) for (const i of [ids[0], ids[k], ids[k + 1]]) { const v = V[i] || [0, 0, 0]; T.push(v[0], v[1], v[2]); }
    }
  }
  return new Float32Array(T);
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  const rd = new FileReader();
  rd.onload = () => busy('Importing ' + f.name, () => {
    const T = /\.obj$/i.test(f.name) ? parseOBJ(new TextDecoder().decode(rd.result)) : parseSTL(rd.result);
    if (!T.length) { toast('No triangles found in ' + f.name, true); return; }
    const m = Core.weldTris(T, 1e-6);
    const b = Core.bboxOf(m.pos), ext = Math.max(b[3] - b[0], b[4] - b[1], b[5] - b[2]) || 1;
    const k = ext > 20 || ext < 0.05 ? 2 / ext : 1, cx = (b[0] + b[3]) / 2, cy = (b[1] + b[4]) / 2, cz = (b[2] + b[5]) / 2;
    for (let i = 0; i < m.pos.length; i += 3) { m.pos[i] = (m.pos[i] - cx) * k; m.pos[i + 1] = (m.pos[i + 1] - cy) * k; m.pos[i + 2] = (m.pos[i + 2] - cz) * k; }
    pushUndo();
    const o = createObj(uniqueName(f.name.replace(/\.[^.]+$/, '')), m.pos, m.idx, 1);
    o.mesh.position.copy(cam.target); select(o); refreshAll(); frameAll(o);
    toast(`Imported ${fmt(triCount(o))} triangles${k !== 1 ? ' · rescaled to fit the scene' : ''}`);
  });
  rd.readAsArrayBuffer(f);
});
function buildSTL(list) {
  const tris = list.map(worldTris), n = tris.reduce((a, t) => a + t.length / 9, 0);
  const buf = new ArrayBuffer(84 + n * 50), dv = new DataView(buf);
  const head = 'Chisel Sculpt export'; for (let i = 0; i < head.length; i++) dv.setUint8(i, head.charCodeAt(i));
  dv.setUint32(80, n, true); let o = 84;
  for (const T of tris) for (let i = 0; i < T.length; i += 9) {
    const ux = T[i + 3] - T[i], uy = T[i + 4] - T[i + 1], uz = T[i + 5] - T[i + 2], vx = T[i + 6] - T[i], vy = T[i + 7] - T[i + 1], vz = T[i + 8] - T[i + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx, l = Math.hypot(nx, ny, nz) || 1;

}
function buildOBJ(list) {

      let line = `v ${(m[0] * x + m[4] * y + m[8] * z + m[12]).toFixed(6)} ${(m[1] * x + m[5] * y + m[9] * z + m[13]).toFixed(6)} ${(m[2] * x + m[6] * y + m[10] * z + m[14]).toFixed(6)}`;
      if (C) line += ` ${C[i].toFixed(4)} ${C[i + 1].toFixed(4)} ${C[i + 2].toFixed(4)}`;
      out.push(line);
    }
    const I = o.idx; for (let t = 0; t < I.length; t += 3) out.push(`f ${I[t] + base} ${I[t + 1] + base} ${I[t + 2] + base}`);
    base += P.length / 3;

}
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, crc, true); h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, name.length, true);

let downloads = null;
if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
$('#exportBtn').addEventListener('click', async () => {
  const list = objects.filter(o => o.visible);
  if (!list.length) { toast('Nothing visible to export', true); return; }
  const blob = zip([{ name: 'sculpt.stl', data: buildSTL(list) }, { name: 'sculpt.obj', data: buildOBJ(list) }]);
  if (downloads) {
    try { await downloads.save({ filename: 'chisel-sculpt.zip', data: blob }); toast('Saved chisel-sculpt.zip (STL + OBJ)'); }
    catch (err) { if (!err || err.code !== 'declined') toast('Export is not available here (' + ((err && err.code) || 'unavailable') + ')', true); }
    return;
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'chisel-sculpt.zip'; document.body.appendChild(a); a.click(); a.remove(); toast('Exported chisel-sculpt.zip (STL + OBJ)'); }
  catch (e) { toast('Export is not available in this view', true); }
});

/* ================= loop ================= */
function loop() {
  requestAnimationFrame(loop);
  if (geoDirty.size) {
    for (const o of geoDirty) { const g = o.mesh.geometry; g.attributes.position.needsUpdate = true; g.computeVertexNormals(); }
    geoDirty.clear(); needsRender = true;
  }
  if (colorDirty.size) { for (const o of colorDirty) updateColors(o); colorDirty.clear(); }
  if (needsRender) { needsRender = false; renderer.render(scene, camera); }
}

/* ================= boot ================= */
renderShapes(); syncTopBtns(); setTool('standard');
(function initScene() {
  const prevDetail = S.detail;
  S.detail = 2;
  const sp = buildShape(SHAPES[0]);
  const a = createObj('Sphere', sp.pos, sp.idx, 0); a.mesh.position.set(-1.25, 0, 0);
  S.detail = 1;
  const cb = buildShape(SHAPES.find(s => s.id === 'rcube'));
  const b = createObj('Round cube', cb.pos, cb.idx, 2); b.mesh.position.set(1.35, -0.12, 0); b.mesh.scale.setScalar(0.62); b.mesh.rotation.y = -0.35;
  S.detail = prevDetail;
  try {
    b.mesh.updateMatrixWorld(true);
    const hole = (dir, shape) => {
      const n = dir.clone().applyQuaternion(b.mesh.quaternion).normalize();
      const pt = b.mesh.position.clone().addScaledVector(n, 0.56);
      const keep = S.hole.shape; S.hole.shape = shape;
      const g = holeGeometry({ obj: b }); S.hole.shape = keep;
      const q = new THREE.Quaternion().setFromUnitVectors(new V3(0, 1, 0), n).multiply(new THREE.Quaternion().setFromAxisAngle(new V3(0, 1, 0), 0.37));
      const cutter = geoTris(g, new THREE.Matrix4().compose(pt, q, new V3(1, 1, 1)));

    };
    const r0 = S.hole.r; S.hole.r = 0.24; hole(new V3(0, 0, 1), 'round'); S.hole.r = 0.17; hole(new V3(1, 0, 0), 'square'); S.hole.r = r0;

  resize(); frameAll(); cam.r *= 0.95; cam.ph = 1.18; cam.th = 0.42; updateCam();
  refreshAll(); renderHud(); loop();
})();
})();
