# The merge gate: builds both outputs, then runs the smoke spec and the golden exports on each (about 3 minutes), beside the MCP server tests.
# A pull request's own new or changed test/*.spec.mjs files (at most 10) also run on both builds, and the phone walk (test/mobile.spec.mjs) runs when it or a file it guards changed; each in jobs of its own beside the rest (tools/ci-select-specs.mjs picks them).
# Everything slower runs in the nightly workflow (nightly.yml): the full Playwright suite, the export judge, the chat judge, the fuzzer, Firefox and WebKit (see test/README.md).
# Runs on every pull request and on pushes to main. A pull request that changes only root-level Markdown files skips everything but the MCP tests. Public repository: Actions minutes are free.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane: a pull request whose every changed file is a root-level Markdown file needs only the MCP tests (they read the README).
  # Fails closed: anything else, an empty diff, a deleted or renamed non-Markdown file, a push, a manual run or a pull request into a branch other than main means code=true; a git error fails this job, which skips the rest and fails the "test" gate.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      specs: ${{ steps.select.outputs.specs }}
      mobile: ${{ steps.select.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # docs/ is built onto the release branch by /ship, never committed on main. Runs on every event; a failure here fails "test".
      - name: docs/ must not be tracked
        run: |
          if git ls-files docs | grep -q .; then echo "docs/ is built onto release by /ship; remove it from this PR"; exit 1; fi
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Only a pull request into main may take the fast lane. A pull request into another branch always runs everything, so a green
          # check on a head commit never rests on a diff against a branch other than main (retargeting a pull request starts no new run).
          if [ "$EVENT" != pull_request ] || [ "$BASE_REF" != main ]; then echo "not a pull request into main: run everything"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # to a file first: a git error must stop the step, which a failure inside <( ) would not
          git diff --name-only --no-renames -z "$BASE...$HEAD" > "$RUNNER_TEMP/changed.list"
          count=0
          other=0
          while IFS= read -r -d '' path; do
            count=$((count + 1))
            printf 'changed: %q\n' "$path"
            [[ "$path" =~ ^[^/]+\.md$ ]] || other=$((other + 1))
          done < "$RUNNER_TEMP/changed.list"
          echo "changed files: $count, not root Markdown: $other"
          if [ "$count" -gt 0 ] && [ "$other" -eq 0 ]; then code=false; else code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # Extra checks for a pull request (into any branch): the spec files it adds or changes, and whether the phone walk must run. A push or a manual run adds nothing.
      # The changed paths reach the script as a file of NUL-separated names; no pull request data is put into a shell line.
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "not a pull request: no extra specs"
            printf 'specs=[]\nmobile=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --no-renames -z "$BASE...$HEAD" > "$RUNNER_TEMP/select.list"
          CHANGED_LIST="$RUNNER_TEMP/select.list" node tools/ci-select-specs.mjs

  # One job per build and spec, side by side (each is about 1.5 minutes of tests). pretest builds both outputs and runs the Node unit tests.
  gate:
    name: gate (${{ matrix.build }}, ${{ matrix.spec }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build: [site, single]
        spec: [smoke, golden]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # no --with-deps: the runner image already has Chromium's libraries, and the apt mirror stalled that step for 10 to 12 minutes twice
      - run: npx playwright install chromium
      - run: npm test -- test/${{ matrix.spec }}.spec.mjs --project=${{ matrix.build }}
      # lets someone who reported an issue try a pull request's single file before a release exists
      - if: ${{ success() && matrix.build == 'single' && matrix.spec == 'smoke' }}
        uses: actions/upload-artifact@v7
        with:
          name: jumpstart-3d-single-file
          path: dist/jumpstart-3d.html
          retention-days: 14
          overwrite: true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-report-${{ matrix.build }}-${{ matrix.spec }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          overwrite: true

  # The pull request's own new or changed spec files (not smoke or golden, which the gate runs; not mobile or chatjudge), at most 10, all in one job per build.
  # Skipped when nothing qualifies, on a docs-only pull request, on a push and on a manual run. Without it a new spec could merge without ever running.
  changed-specs:
    name: changed specs (${{ matrix.build }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.specs != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        build: [site, single]
    env:
      SPECS: ${{ needs.changes.outputs.specs }}
      BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run the changed specs
        run: |
          # the list is JSON; read it back one NUL-ended path at a time so a name with spaces stays one argument
          specs=()
          while IFS= read -r -d "" path; do specs+=("$path"); done < <(jq -j '.[] + "\u0000"' <<< "$SPECS")
          [ "${#specs[@]}" -gt 0 ] || { echo "no specs in the list"; exit 1; }
          printf 'running: %s\n' "${specs[@]}"
          npm test -- "${specs[@]}" --project="$BUILD"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: changed-specs-report-${{ matrix.build }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          overwrite: true

  # The phone walk (375 px touch, simulated 4G, size and time budgets) catches layout and touch regressions the desktop specs cannot.
  # Runs when the pull request changes test/mobile.spec.mjs or a file it guards: the viewport, the Beginner and Advanced panels, the page shell, the turn and pivot controls.
  phone-walk:
    name: phone walk (mobile project)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test -- test/mobile.spec.mjs --project=mobile
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phone-walk-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          overwrite: true

  mcp:
    name: mcp server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mcp
      - run: npx playwright install chromium
      - run: npm run test:mcp

  # The branch rules on main require a check named exactly "test" (and "analyze" and "CodeQL" from codeql.yml); the matrix jobs report under other names.
  # Passes only when "changes" succeeded and either
  #   - code=true:  the gate and the MCP tests succeeded, or
  #   - code=false: the MCP tests succeeded and the gate was skipped (exactly "skipped", not failed or cancelled).
  # The changed-specs and phone-walk jobs must have succeeded when they were wanted (code=true and a non-empty spec list, or mobile=true) and be exactly "skipped" otherwise.
  test:
    needs: [changes, gate, changed-specs, phone-walk, mcp]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          GATE: ${{ needs.gate.result }}
          SPECS: ${{ needs.changes.outputs.specs }}
          SPECS_RESULT: ${{ needs.changed-specs.result }}
          MOBILE: ${{ needs.changes.outputs.mobile }}
          MOBILE_RESULT: ${{ needs.phone-walk.result }}
          MCP: ${{ needs.mcp.result }}
        run: |
          echo "changes=$CHANGES code=$CODE gate=$GATE specs=$SPECS changed-specs=$SPECS_RESULT mobile=$MOBILE phone-walk=$MOBILE_RESULT mcp=$MCP"
          [ "$CHANGES" = success ] || { echo "the changes job did not succeed"; exit 1; }
          [ "$MCP" = success ] || { echo "the MCP tests did not succeed"; exit 1; }
          want_specs=skipped; want_mobile=skipped
          if [ "$CODE" = true ]; then
            if [ "$SPECS" != '[]' ]; then want_specs=success; fi
            if [ "$MOBILE" = true ]; then want_mobile=success; fi
          fi
          [ "$SPECS_RESULT" = "$want_specs" ] || { echo "the changed-specs jobs are $SPECS_RESULT, expected $want_specs"; exit 1; }
          [ "$MOBILE_RESULT" = "$want_mobile" ] || { echo "the phone walk is $MOBILE_RESULT, expected $want_mobile"; exit 1; }
          if [ "$CODE" = true ]; then
            [ "$GATE" = success ] && exit 0
          elif [ "$CODE" = false ]; then
            [ "$GATE" = skipped ] && exit 0
          fi
          echo "not every needed job succeeded"
          exit 1
