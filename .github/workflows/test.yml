# The merge gate: builds both outputs, then runs the smoke spec and the golden exports on each (about 3 minutes), beside the MCP server tests.
# Everything slower runs in the nightly workflow (nightly.yml): the full Playwright suite, the export judge, the chat judge, the fuzzer, Firefox and WebKit (see test/README.md).
# Runs on every pull request and on pushes to main. A pull request that changes only root-level Markdown files skips everything but the MCP tests. Public repository: Actions minutes are free.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane: a pull request whose every changed file is a root-level Markdown file needs only the MCP tests (they read the README).
  # Fails closed: anything else, an empty diff, a deleted or renamed non-Markdown file, a push, a manual run or a pull request into a branch other than main means code=true; a git error fails this job, which skips the rest and fails the "test" gate.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Only a pull request into main may take the fast lane. A pull request into another branch always runs everything, so a green
          # check on a head commit never rests on a diff against a branch other than main (retargeting a pull request starts no new run).
          if [ "$EVENT" != pull_request ] || [ "$BASE_REF" != main ]; then echo "not a pull request into main: run everything"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # to a file first: a git error must stop the step, which a failure inside <( ) would not
          git diff --name-only --no-renames -z "$BASE...$HEAD" > "$RUNNER_TEMP/changed.list"
          count=0
          other=0
          while IFS= read -r -d '' path; do
            count=$((count + 1))
            printf 'changed: %q\n' "$path"
            [[ "$path" =~ ^[^/]+\.md$ ]] || other=$((other + 1))
          done < "$RUNNER_TEMP/changed.list"
          echo "changed files: $count, not root Markdown: $other"
          if [ "$count" -gt 0 ] && [ "$other" -eq 0 ]; then code=false; else code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # One job per build and spec, side by side (each is about 1.5 minutes of tests). pretest builds both outputs and runs the Node unit tests.
  gate:
    name: gate (${{ matrix.build }}, ${{ matrix.spec }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build: [site, single]
        spec: [smoke, golden]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # no --with-deps: the runner image already has Chromium's libraries, and the apt mirror stalled that step for 10 to 12 minutes twice
      - run: npx playwright install chromium
      - run: npm test -- test/${{ matrix.spec }}.spec.mjs --project=${{ matrix.build }}
      # lets someone who reported an issue try a pull request's single file before a release exists
      - if: ${{ success() && matrix.build == 'single' && matrix.spec == 'smoke' }}
        uses: actions/upload-artifact@v7
        with:
          name: jumpstart-3d-single-file
          path: dist/jumpstart-3d.html
          retention-days: 14
          overwrite: true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-report-${{ matrix.build }}-${{ matrix.spec }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          overwrite: true

  mcp:
    name: mcp server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mcp
      - run: npx playwright install chromium
      - run: npm run test:mcp

  # The branch rules on main require a check named exactly "test" (and "analyze" and "CodeQL" from codeql.yml); the matrix jobs report under other names.
  # Passes only when "changes" succeeded and either
  #   - code=true:  the gate and the MCP tests succeeded, or
  #   - code=false: the MCP tests succeeded and the gate was skipped (exactly "skipped", not failed or cancelled).
  test:
    needs: [changes, gate, mcp]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          GATE: ${{ needs.gate.result }}
          MCP: ${{ needs.mcp.result }}
        run: |
          echo "changes=$CHANGES code=$CODE gate=$GATE mcp=$MCP"
          [ "$CHANGES" = success ] || { echo "the changes job did not succeed"; exit 1; }
          [ "$MCP" = success ] || { echo "the MCP tests did not succeed"; exit 1; }
          if [ "$CODE" = true ]; then
            [ "$GATE" = success ] && exit 0
          elif [ "$CODE" = false ]; then
            [ "$GATE" = skipped ] && exit 0
          fi
          echo "not every needed job succeeded"
          exit 1
