# Builds both outputs and runs the Playwright regression tests (see test/README.md).
# Runs on every pull request and on pushes to main. Public repository: Actions minutes are free.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mcp
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # lets someone who reported an issue try a pull request's single file before a release exists
      - uses: actions/upload-artifact@v7
        with:
          name: jumpstart-3d-single-file
          path: dist/jumpstart-3d.html
          retention-days: 14
      - run: npm run test:mcp
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
