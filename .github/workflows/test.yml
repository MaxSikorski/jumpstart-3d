# Builds both outputs and runs the Playwright regression tests (see test/README.md).
# Runs on every pull request and on pushes to main. Public repository: Actions minutes are free.
name: test

on:
  pull_request:
  push:
    branches: [main, judge1] # J1-TEMP: judge1 only while the judge is being measured
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # J1: The pinned consumer AppImages were probed on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mcp
      - run: npx playwright install --with-deps chromium
      - run: node build.mjs && npx playwright test test/golden.spec.mjs # J1-TEMP: golden only while measuring; restore to npm test
        # J1: The collector and judge must identify the same workflow attempt.
        env:
          JUDGE_EXPORTS: '1'
          JUDGE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # J1: Cache only verified, versioned downloads, never geometry or results. The cache is saved right after
      # a good install, not at the end of the job, so a failing judge still leaves a warm cache for the next run.
      - uses: actions/cache/restore@v4
        id: judge-cache
        with:
          path: ~/.cache/js3d-judge
          key: judge-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-prusa2.8.1-freecad1.1.4
      - name: Install export judge consumers
        timeout-minutes: 8
        run: bash tools/install-judge-tools.sh
      - if: steps.judge-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/js3d-judge
          key: judge-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-prusa2.8.1-freecad1.1.4
      # J1-TEMP: authors the STEP controls once; removed after the files are committed.
      - name: Author STEP controls
        run: JUDGE_FIXTURE_OUTPUT="$PWD/test/fixtures/judge" "$FREECAD_CMD" "$PWD/test/fixtures/judge/make-step-controls.py" </dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: step-controls
          path: test/fixtures/judge/*.step
          retention-days: 7
      # J1-TEMP end.
      - run: npm run test:judge:unit
      # J1-TEMP: which placement flags let the multi-object 3MFs slice; removed after the answer.
      - name: Slicer flag experiments
        if: ${{ !cancelled() }}
        run: |
          out="$RUNNER_TEMP/exp"; mkdir -p "$out"
          variants=("--center 0,0 --dont-arrange --no-ensure-on-bed" "--center 0,0 --dont-arrange" "--center 0,0 --dont-arrange --ensure-on-bed" "--center 0,0" "--ensure-on-bed" "--no-ensure-on-bed" "--merge")
          for name in advanced-bricks nameplate advanced-pattern-mod fasteners; do
            for flags in "${variants[@]}"; do
              rm -f "$out/x.gcode"
              set +e
              "$PRUSA_SLICER" --threads 1 --load tools/judge-prusa.ini $flags --export-gcode --output "$out/x.gcode" "test-results/judge/site/$name.3mf" > "$out/o.txt" 2> "$out/e.txt"
              code=$?
              set -e
              echo "EXPERIMENT $name flags=[$flags] exit=$code layers=$(grep -c '^;LAYER_CHANGE$' "$out/x.gcode" 2>/dev/null || echo none) stderr=$(tr '\n' '~' < "$out/e.txt" | cut -c1-160) conflicts=$(grep -c 'path conflicts' "$out/o.txt")"
            done
          done
      # J1-TEMP end.
      - name: Native negative controls
        timeout-minutes: 5
        run: npm run test:judge:integration
      - name: Judge golden exports
        # The full report is wanted even when the controls fail.
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          JUDGE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:judge
      # J1-TEMP: the measured values of the first runs; removed once the manifest is frozen.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: judge-measurements
          path: |
            test-results/judge/summary.json
            test-results/judge/measurements.json
            test-results/judge/run/
            test-results/judge/logs/
            test-results/judge/install/
            test-results/judge-self-test/
          retention-days: 7
      # J1-TEMP end.
      # J1 end.
      - run: npm run test:mcp
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
