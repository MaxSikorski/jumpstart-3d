# Builds both outputs and runs the Playwright regression tests (see test/README.md).
# Runs on every pull request and on pushes to main. Public repository: Actions minutes are free.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # J1: The pinned consumer AppImages were probed on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mcp
      - run: npx playwright install --with-deps chromium
      - run: npm test
        # J1: The collector and judge must identify the same workflow attempt.
        env:
          JUDGE_EXPORTS: '1'
          JUDGE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # J1: Both consumers are downloaded from their release pages and checksum-verified; a cache saved nothing measurable (see test/README.md).
      - name: Install export judge consumers
        timeout-minutes: 8
        run: bash tools/install-judge-tools.sh
      - run: npm run test:judge:unit
      - name: Native negative controls
        timeout-minutes: 5
        run: npm run test:judge:integration
      - name: Judge golden exports
        # The full report is wanted even when the controls fail.
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          JUDGE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:judge
      # J1 end.
      # lets someone who reported an issue try a pull request's single file before a release exists
      - uses: actions/upload-artifact@v7
        with:
          name: jumpstart-3d-single-file
          path: dist/jumpstart-3d.html
          retention-days: 14
      - run: npm run test:mcp
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
