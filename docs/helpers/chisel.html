<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Chisel · JumpStart 3D</title>
<style>
:root{
  color-scheme: dark;
  --bg:#131518; --view-a:#30353c; --view-b:#15171a;
  --panel:#1a1d21; --panel-2:#21252b; --line:#2d3239; --line-2:#3a4048;

}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 var(--sans);overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-columns:58px minmax(0,1fr) 300px;grid-template-rows:46px minmax(0,1fr) 28px;grid-template-areas:"top top top" "tools view panel" "status status status"}
/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}

.brand b{font:600 17px/1 var(--cond);letter-spacing:.02em}
.brand b i{font-style:normal;color:var(--accent)}

.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

.tool{appearance:none;width:42px;height:40px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative;flex:none}

.tool:hover{color:var(--text);background:var(--panel-2)}

/* viewport */

#overlay{pointer-events:none}
#hud{position:absolute;left:12px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.pill{font:500 11px/1 var(--mono);padding:5px 8px;border-radius:99px;background:var(--pill-bg);border:1px solid var(--line);color:var(--muted);backdrop-filter:blur(6px)}
.pill b{color:var(--text);font-weight:500}
.pill.on b{color:var(--accent)}
.pill.cutp b{color:var(--cut)}

#busy div{font:500 12px var(--mono);padding:10px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line-2);display:flex;align-items:center;gap:10px}

/* Chisel geometry core: welding, subdivision, exact CSG (local splitting + ray-parity), voxel remesh (surface nets). No dependencies. */
(function (root) {
  'use strict';

  function bboxOf(T) {
    let a = Infinity, b = Infinity, c = Infinity, d = -Infinity, e = -Infinity, f = -Infinity;

      vi[i] = id;
    }

      const v = idx[i] * 3; let x = pos[v], y = pos[v + 1], z = pos[v + 2];

        const nx = m[0] * x + m[4] * y + m[8] * z + m[12];
        const ny = m[1] * x + m[5] * y + m[9] * z + m[13];
        const nz = m[2] * x + m[6] * y + m[10] * z + m[14];
        x = nx; y = ny; z = nz;

    camera: fake,
    view: { target: new V3(), az: 0, el: 0, dist: 7, roll: 0 },
    anim: null,

    // Chisel's camera, seen in JumpStart 3D's terms

      v.el = Math.PI / 2 - cam.ph; v.dist = cam.r; v.roll = cam.roll || 0;

    if (!P.playing) setTimeout(syncMotionFields, 0);
    track.ondblclick = (ev) => { if (ev.target.closest('.ptl-key')) return; seek(timeAt(ev)); addKeyNow(); };

  }

  // ---------------------------------------------------------------- the panel
  const sec = document.createElement('section'); sec.className = 'sec'; sec.id = 'pupSec';
  $('#panel').prepend(sec);
  function renderPanel() {

    } else {

      h += `<p class="hint">${P.tool === 'pose' ? 'Drag a <b>yellow</b> joint to bend its bone, the <b>blue</b> one to move the whole character. Each pose becomes a key at the playhead.' : 'Drag joints to where they belong inside the model (knees in the knees…). The posed copy follows.'}</p>`;

      h += `<button class="action sm" id="pupUnrig" style="width:100%;margin-top:4px">Remove skeleton</button>`;
    }
    const s = P.set;
    h += `<div class="sub-h">Virtual set</div>
      <div class="seg" id="pupBg"><button data-bg="none" aria-pressed="${s.bg === 'none'}">None</button><button data-bg="color" aria-pressed="${s.bg === 'color'}">Color</button><button data-bg="image" aria-pressed="${s.bg === 'image'}">Picture</button></div>

      <label class="check"><input type="checkbox" id="pupFloor" ${s.floor ? 'checked' : ''}>Stage floor</label>
      <label class="check"><input type="checkbox" id="pupShadows" ${s.shadows ? 'checked' : ''}>Soft shadows</label>
      ${s.floor ? `<div class="colorrow"><span>Floor</span><input type="color" id="pupFloorCol" value="${s.floorColor}"></div>` : ''}
      <label class="check"><input type="checkbox" id="pupFrameChk" ${s.frame ? 'checked' : ''}>Show the camera frame (what the video sees)</label>`;
    h += `<div class="sub-h">Export video</div>
      <div class="seg" id="pupRes"><button data-res="720" aria-pressed="${P.res === 720}">720p</button><button data-res="1080" aria-pressed="${P.res === 1080}">1080p</button></div>
      <button class="action primary" id="pupExport" style="width:100%;margin-top:6px" ${P.exporting ? 'disabled' : ''}>${P.exporting ? 'Exporting…' : `Export MP4 (${P.dur.toFixed(1)} s)`}</button>
      <div class="pup-prog" id="pupProg" hidden><i></i></div>

    sec.innerHTML = h;
    for (let i = 0; i < 3; i++) for (const w of ['Move', 'Turn']) {

  function pickBg() {

        const W = 1920, H = 1080, c = document.createElement('canvas'); c.width = W; c.height = H;

  // ---------------------------------------------------------------- video export
  async function exportVideo() {
    if (P.exporting) return;
    const W = P.res === 1080 ? 1920 : 1280, H = P.res === 1080 ? 1080 : 720, fps = P.fps, frames = Math.max(1, Math.round(P.dur * fps));
    play(false);
    P.exporting = true; renderPanel(); markers(); req();
    const prog = $('#pupProg'), bar = prog && prog.firstElementChild; if (prog) prog.hidden = false;
    const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
    let r2;
    try { r2 = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true }); }
    catch (e) { P.exporting = false; renderPanel(); toast("Couldn't start the video renderer here", true); return; }
    r2.outputColorSpace = renderer.outputColorSpace; r2.setPixelRatio(1); r2.setSize(W, H, false);
    // the set: background (picture or color), the characters and props, floor and shadows
    const es = new THREE.Scene();
    if (P.set.bg === 'image' && P.set.img) { const t = new THREE.TextureLoader().load(P.set.img); t.colorSpace = THREE.SRGBColorSpace; es.background = t; await new Promise((res) => { const i = new Image(); i.onload = res; i.onerror = res; i.src = P.set.img; }); t.needsUpdate = true; }
    else if (P.set.bg === 'color') es.background = new THREE.Color(P.set.color);
    else { const cs = getComputedStyle(document.documentElement); es.background = new THREE.Color(cs.getPropertyValue('--view-b').trim() || '#20242a'); }
    // the camera: the current view, cropped to the 16:9 frame
    const fr = frameRect(), cam = camera.clone();
    cam.aspect = W / H; cam.fov = 2 * Math.atan(Math.tan((camera.fov * Math.PI) / 360) * (fr.h / fr.vh)) * 180 / Math.PI;
    cam.updateProjectionMatrix();
    const t0 = P.t;
    const draw = async (i) => {
      seek(i / fps); frame();
      while (es.children.length) es.remove(es.children[0]);
      for (const o of objects) {
        if (!o.visible) continue;
        const src = o.skel && o._pm ? o._pm : o.mesh;
        const m = new THREE.Mesh(src.geometry, src.material); m.matrixAutoUpdate = false; src.updateMatrixWorld(true); m.matrix.copy(src.matrixWorld); m.matrixWorld.copy(src.matrixWorld); es.add(m);
      }
      if (P.set.floor) { const f = setFloor.clone(); f.visible = true; es.add(f); }
      if (P.set.shadows) for (const b of blobs.children) es.add(b.clone());
      r2.render(es, cam);
      if (i % 3 === 0) { if (bar) bar.style.width = ((i + 1) / frames) * 100 + '%'; await new Promise((r) => setTimeout(r, 0)); }
    };
    let out = null, err = null;
    try { out = await MP4.record(canvas, frames, fps, draw, (f) => { if (bar) bar.style.width = f * 100 + '%'; }); }
    catch (e) { err = e; }
    if (!out && !err) {
      // no frame-by-frame encoder in this browser: record it as it plays instead
      try { out = await realTime(canvas, frames, fps, draw); } catch (e) { err = e; }
    }
    r2.dispose(); r2.forceContextLoss && r2.forceContextLoss();
    P.exporting = false; if (prog) prog.hidden = true; seek(t0); renderPanel(); markers(); req();
    if (err || !out) { toast("Couldn't make the video in this browser" + (err ? ': ' + (err.message || err) : ''), true); return; }
    const name = ((sel && sel.name) || 'animation').replace(/[^\w\- ]+/g, '').trim() || 'animation';
    const file = name + '.' + (out.ext || 'mp4');
    if (host && host.save) await host.save(file, out.bytes);
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out.bytes], { type: out.ext === 'webm' ? 'video/webm' : 'video/mp4' })); a.download = file; a.click(); }
    toast(`Video saved: ${file} (${W}×${H}, ${P.dur.toFixed(1)} s${out.codec ? ', ' + (out.codec === 'avc' ? 'H.264' : 'VP9') : ''})`);
  }
  async function realTime(canvas, frames, fps, draw) {
    if (!canvas.captureStream || typeof MediaRecorder === 'undefined') return null;
    const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t));
    if (!type) return null;

    rec.stop(); await done;
    return { bytes: new Uint8Array(await new Blob(parts).arrayBuffer()), ext: type.startsWith('video/mp4') ? 'mp4' : 'webm' };
  }

  // ---------------------------------------------------------------- saving with the sculpt
  const data = (o) => (o.skel ? { skel: { rig: o.skel.rig, motion: o.skel.motion || undefined, ver: o.skel.ver || 1, k: o.skel.k, parts: o.skel.parts || undefined, bones: o.skel.bones.map((b) => ({ name: b.name, parent: b.parent, head: b.head, tail: b.tail })) }, anim: o.anim ? { dur: o.anim.dur || P.dur, keys: o.anim.keys } : null } : null);
  function adopt(o, d) { if (!d || !d.skel) return; o.skel = JSON.parse(JSON.stringify(d.skel)); o.skel.ver = o.skel.ver || 1; o.anim = d.anim ? JSON.parse(JSON.stringify(d.anim)) : { keys: [] }; o._w = null; }

  // the top-bar button
  const btn = document.createElement('button'); btn.className = 'btn'; btn.id = 'pupBtn'; btn.setAttribute('aria-pressed', 'false');
  btn.title = 'Puppet Animator: rig, pose and animate your models, then export a video';
  btn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="3" r="1.6"/><path d="M8 4.6v5M5 6.5l3-1 3 1M8 9.6l-2 4M8 9.6l2 4M3 1.5h10" opacity=".9"/></svg><span class="hide-sm">Animate</span>';
  btn.onclick = () => (P.on ? leave() : enter());
  const fb = $('#frameBtn'); if (fb) fb.before(btn);

  return { P, enter, leave, frame, down, move, up, hover, key, data, adopt, seek, play, setKey, applyLib, addSkeleton, skin, solve, LIB, renderPanel, renderTimeline, get on() { return P.on; }, exportVideo, poseAt };
})();

// ---- History: every sculpting step, on a strip under the view; click a dot to go back to it
const HIST = (() => {
  const el = document.createElement('div'); el.id = 'hist'; view.append(el);
  let open = false;
  function render() {
    if (PUP.on) { el.hidden = true; return; }
    const u = undoStack.length, r = redoStack.length;
    el.hidden = !(u + r);
    if (el.hidden) return;
    const when = (s) => (s && s.at ? new Date(s.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '');
    const label = (s) => (s && s.tool ? ((BRUSHES.find((b) => b.id === s.tool) || OTHER_TOOLS.find((b) => b.id === s.tool) || { name: s.tool }).name) : 'Step');
    let dots = '';
    for (let i = 0; i < u; i++) dots += `<button class="hd past" data-h="${i - u}" title="Go back to before: ${esc(label(undoStack[i]))} ${when(undoStack[i])}"></button>`;
    dots += `<span class="hd now" title="Now"></span>`;
    for (let i = r - 1; i >= 0; i--) dots += `<button class="hd future" data-h="${r - i}" title="Go forward: ${esc(label(redoStack[i]))}"></button>`;
    el.innerHTML = `<button class="hist-t" id="histT" title="History: click a dot to go back to that point">History</button>${open ? `<div class="hist-dots">${dots}</div>` : `<span class="hist-n">${u} step${u === 1 ? '' : 's'}</span>`}`;
    $('#histT').onclick = () => { open = !open; render(); };
    el.querySelectorAll('[data-h]').forEach((b) => b.onclick = () => { const n = +b.dataset.h; if (n < 0) for (let i = 0; i < -n; i++) undo(); else for (let i = 0; i < n; i++) redo(); render(); });
  }
  return { render };
})();

// JumpStart 3D's theme: page colors come from CSS; the 3D view's colors are set here
const GRID = { light: ['#8b9aaa', '#c3cbd4'], dark: ['#5a6774', '#2f3741'], contrast: ['#b3b3b3', '#4d4d4d'] };
function applyTheme(name) {
  if (!GRID[name]) name = 'dark';
  document.documentElement.dataset.ui = name;
  const cs = getComputedStyle(document.documentElement), v = (k) => cs.getPropertyValue(k).trim();
  const acc = new THREE.Color(v('--accent')), cut = new THREE.Color(v('--cut'));
  const rgba = (c, a) => { const h = c.getHexString(); return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`; };
  Object.assign(TH, { accent: '#' + acc.getHexString(), accentA: rgba(acc, 0.85), accentF: rgba(acc, 0.15), cut: '#' + cut.getHexString(), cutF: rgba(cut, 0.16) });
  ringMat.color.copy(acc); ringMat2.color.copy(acc);
  for (const m of [ghost.material, ghostWire.material, slicePlane.material, sliceEdge.material]) m.color.copy(cut);
  const [c1, c2] = GRID[name].map((h) => new THREE.Color(h)), col = grid.geometry.attributes.color, lines = col.count / 4, mid = (lines - 1) / 2;
  for (let i = 0; i < lines; i++) { const c = i === mid ? c1 : c2; for (let k = 0; k < 4; k++) col.setXYZ(i * 4 + k, c.r, c.g, c.b); }
  col.needsUpdate = true; grid.material.opacity = name === 'contrast' ? 1 : 0.75;
  wireMat.color.set(name === 'contrast' ? 0x000000 : 0x0a0c0f); wireMat.opacity = name === 'contrast' ? 0.45 : 0.2;
  try { CAD.theme(host && host.themeColors ? host.themeColors() : null); } catch (e) { console.error(e); }

}
if (host && host.theme) applyTheme(host.theme());
window.__chisel = {
  setTheme: (name) => applyTheme(name),
  setPerf: (name) => PERF.set(name),
  setLevel: (level) => setLevel(level),
  snapChanged: () => CAD.snapChanged(),
  level: () => (S.easy ? 'easy' : 'pro'),
  // what Chisel has: per object its design body, versions and matrix
  state: () => objects.filter(o => !o.ref || o.jsId).map(o => ({ cid: o.id, jsId: o.jsId || null, rev: o.rev || 0, syncRev: o.syncRev ?? -1 })),
  // the design's sculpts: add / update / remove to match (geometry only when sent)
  load(list, opts = {}) {
    const keep = new Set(list.map(e => e.jsId));
    refQuiet = true;
    // another design was opened: nothing unsaved from the old one stays
    for (const o of [...objects]) if ((o.jsId || opts.fresh) && !keep.has(o.jsId)) removeObj(o);
    if (opts.fresh) refGone.clear();
    // the design's other bodies, as they are: gone ones leave, changed ones are redone
    const ids = new Set(opts.refIds || []);
    for (const o of [...objects]) if (o.ref && !o.jsId && !ids.has(o.ref) && !refTouched(o)) removeObj(o);
    for (const r of opts.refs || []) {
      const C = Core.transformTris(new Float32Array(r.pos), J2C.elements), I = new Uint32Array(r.idx);
      const bb = Core.bboxOf(C), cx = (bb[0] + bb[3]) / 2, cy = (bb[1] + bb[4]) / 2, cz = (bb[2] + bb[5]) / 2;
      for (let i = 0; i < C.length; i += 3) { C[i] -= cx; C[i + 1] -= cy; C[i + 2] -= cz; }
      // welded for every tool; drawn as the design draws it (crisp edges) until touched
      const m = Core.cleanMesh(Core.toTris(C, I));
      if (!m.idx.length) continue;
      let o = objects.find(x => x.ref === r.ref && !x.jsId);
      if (o && refTouched(o)) continue;
      if (o) setGeometry(o, m.pos, m.idx);
      else { o = createObj(uniqueName(r.name), m.pos, m.idx, 0); o.ref = r.ref; }
      o.mesh.position.set(cx, cy, cz); o.mesh.quaternion.identity(); o.mesh.scale.set(1, 1, 1); o.mesh.updateMatrixWorld(true);
      o.snap = o.refSnap = { pos: o.pos.slice(), idx: o.idx, mask: o.mask.slice(), paint: o.paint.slice() }; o.dirty = false;
      o.refM = Array.from(o.mesh.matrixWorld.elements); o.refKey = r.key; o.refDisp = { pos: C, idx: I }; refShow(o);
    }
    refQuiet = false;
    for (const e of list) {
      let o = objects.find(x => x.jsId === e.jsId);
      if (e.pos) {
        // typed arrays from the host page belong to its window: three.js here needs its own
        const pos = new Float32Array(e.pos), idx = new Uint32Array(e.idx), paint = e.paint ? new Float32Array(e.paint) : null;
        if (!o) { o = createObj(uniqueName(e.name || 'Sculpt'), pos, idx, e.matcap || 0, undefined, null, paint); o.jsId = e.jsId; }
        else setGeometry(o, pos, idx, null, paint);
      }
      if (!o) continue;
      if (e.name) o.name = e.name;
      setMatrix(o, e.matrix);
      o.rev = o.syncRev = e.rev;
      // its skeleton and animation (unless changed here and not saved yet)
      if ('pup' in e && (o.pupRev || 0) === (o.pupSync || 0)) { if (e.pup) PUP.adopt(o, JSON.parse(JSON.stringify(e.pup))); else { o.skel = null; o.anim = null; } o.pupRev = o.pupSync = 0; }
      o.cm = e.matrix.slice();

  },
  // everything to save into the design (mesh data only where it changed)
  collect() {
    return objects.filter(o => !o.ref || refTouched(o)).map(o => {
      o.mesh.updateMatrixWorld(true);
      const changed = !o.jsId || o.rev !== o.syncRev;
      return { cid: o.id, jsId: o.jsId || null, ref: o.jsId ? null : o.ref || null, name: o.name, rev: o.rev || 0, matcap: o.matcap, color: MATCAPS[o.matcap] ? MATCAPS[o.matcap].c : [0.7, 0.6, 0.5], visible: o.visible,
        matrix: Array.from(o.mesh.matrixWorld.elements), C2J: Array.from(C2J.elements),
        pos: changed ? o.pos : null, idx: changed ? o.idx : null, paint: changed && hasPaint(o) ? o.paint : null, pup: PUP.data(o) };
    });
  },
  // after saving: which design body each object now belongs to
  linked(list) { for (const e of list) { const o = objects.find(x => x.id === e.cid); if (o) { o.jsId = e.jsId; o.syncRev = e.rev; o.pupSync = o.pupRev || 0; o.ref = o.refSnap = o.refM = null; } } refGone.clear(); refreshAll(); },
  // the design objects here (and what they were made from), and the ones that left
  refState: () => objects.filter(o => o.ref && !o.jsId).map(o => ({ ref: o.ref, key: o.refKey, touched: refTouched(o) })),
  refGone: () => [...refGone],
  shown() { resize(); renderDesignSec(); refreshAll(); req(); },
  undo: () => undo(), redo: () => redo(),
  _dbg: (src) => eval(src), // for automated tests
  dirty: () => refGone.size > 0 || objects.some(o => (o.pupRev || 0) !== (o.pupSync || 0)) || objects.some(o => o.ref && !o.jsId ? refTouched(o) : (!o.jsId || o.rev !== o.syncRev)),
};

/* ================= loop ================= */
function loop() {
  requestAnimationFrame(loop);
  if (geoDirty.size) {
    for (const o of geoDirty) { const g = o.mesh.geometry; g.attributes.position.needsUpdate = true; g.computeVertexNormals(); }
    geoDirty.clear(); needsRender = true;
  }
  if (colorDirty.size) { for (const o of colorDirty) updateColors(o); colorDirty.clear(); }
  if (needsRender) { needsRender = false; CAD.frame(); CUBE.frame(); PUP.frame(); renderer.render(scene, camera); }
}

/* ================= boot ================= */
renderShapes(); syncTopBtns(); setTool('standard');
(function initScene() {
  select(null);
  resize(); frameAll(); updateCam();
  renderChars(); TEX._sel = undefined;
  refreshAll(); renderHud(); loop();
  if (host && host.level) setLevel(host.level());
  if (host && host.ready) host.ready();
})();
})();
</script>
